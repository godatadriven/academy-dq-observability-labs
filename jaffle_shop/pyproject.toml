[project]
name = "jaffle-shop-dq"
version = "0.1.0"
requires-python = ">=3.10,<3.13"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "soda-core>=3.3,<4.0",
    "soda-core-duckdb>=3.3,<4.0",
    "setuptools",
    "dbt-metricflow[duckdb]>=0.14.0",
]

[tool.uv]
# DuckDB 1.0.0 has a high-severity flaw in sniff_csv, fixed in 1.1.0. soda-core-duckdb caps
# DuckDB below 1.1.0; this override lifts the cap. Every lab was re-run with it.
override-dependencies = ["duckdb>=1.1.0"]
