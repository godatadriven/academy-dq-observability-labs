# Lab 2 · A gate on the staging model: a data contract. The steps: labs/lab2.md
# The data contract lists the columns that stg_pos_events promises. not_null: amount can never be empty.
version: 2
models:
  - name: stg_pos_events
    config:
      contract:
        enforced: false
    columns:
      - name: payment_id
        data_type: integer
      - name: customer_id
        data_type: integer
      - name: cafe_id
        data_type: varchar
      - name: payment_method
        data_type: varchar
      - name: amount
        data_type: integer
        constraints:
          - type: not_null
      - name: paid_at
        data_type: timestamp
      - name: _etl_loaded_at
        data_type: timestamp
