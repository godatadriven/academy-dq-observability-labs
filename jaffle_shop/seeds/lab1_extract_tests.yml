# LAB 1 · Six defects, six tests                                   Time: 30 minutes
#
# Goal: write one dbt test for each of Module 1's six defects. All six must fail.
# You learn: dbt's generic tests, built in or from the dbt_expectations package, and a singular test.
# A failing test is good news here. It means that the test found the bad row. Do not fix the data.
#
# The table is Module 1's "Spot the defects" table, loaded as the seed orders_daily_extract.
# To see it, run:  dbt show --select orders_daily_extract
#
# Steps
#   1. Switch this file on. Select every line below the START line, then press Cmd+/ (Windows: Ctrl+/).
#   2. Fill the six blanks: ______ or ___. Each comment names one defect, its rule, and a hint.
#   3. Open tests/lab1_updated_before_placed.sql. Switch it on and fill its two blanks.
#   4. Run:  dbt test --select orders_daily_extract
#
# When it works: six lines say FAIL 1. The last line starts with  Done. PASS=0 WARN=0 ERROR=6
# dbt counts a failed test as an error. Six errors is the goal.
# Stuck? LABS.md, Lab 1. To start over: git checkout seeds/lab1_extract_tests.yml
# Done early? Write "built in", "package" or "query" next to each test. Why do most of the six need more than a built-in test?
#
# ---- START: select from the next line to the end of the file, then press Cmd+/ ----
