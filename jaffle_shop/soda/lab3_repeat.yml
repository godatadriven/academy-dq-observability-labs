# Lab 3, Part B · Module 1's rule as a Soda check. The steps: labs/lab3.md
# ${NOW} is the morning of the scan. You set it in the command with -v NOW="...".

# DISTRIBUTION · Module 1's rule: alert when too many payments repeat the customer's last amount.
# payments_repeat_rate holds that percent for each day. Someone set the limit below. Your turn: labs/lab3.md
checks for payments_repeat_rate:
  - repeat_rate < 5:
      repeat_rate query: |
        select repeat_rate_pct from payments_repeat_rate where pay_date = cast('${NOW}' as date) - 1
      name: "distribution: payments do not repeat the customer's last amount"
