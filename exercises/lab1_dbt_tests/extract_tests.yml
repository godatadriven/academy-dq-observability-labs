# Lab 1 · Six defects, six tests. The steps are in README.md.
# Each comment below is one defect and its rule. Fill each blank.
version: 2
seeds:
  - name: orders_daily_extract
    data_tests:
      # UNIQUENESS · C-1042 appears twice.
      # Rule: no two rows share customer, total, and email.
      # The rule looks at three columns together. Pick one: expect_compound_columns_to_be_unique
      # or expect_column_values_to_be_unique
      - dbt_expectations.______:
          arguments:
            column_list: ["customer_id", "order_total", "email"]
    columns:
      - name: email
        data_tests:
          # COMPLETENESS · the email is missing.
          # Rule: email is not null. A built-in test.
          - ______
          # VALIDITY · "(at)" is not an email address.
          # Rule: email matches a pattern with @ and a dot after it.
          # In a pattern, .+ means some text and \\. means a real dot. In YAML, write each backslash twice.
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: "______"
      - name: order_total
        data_tests:
          # ACCURACY · a total below zero: that did not happen.
          # Rule: order_total is 0 or more.
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: ___
      - name: _loaded_at
        data_tests:
          # TIMELINESS · refreshed on 2 July, today is 11 July.
          # Rule: the table's load time is within one day of now. datepart is a unit of time, interval a number.
          # dbt compares with the real time now, so this test always fails on this old table.
          - dbt_expectations.expect_row_values_to_have_recent_data:
              arguments:
                datepart: ___
                interval: ___

# CONSISTENCY · an order in 2027, last updated in 2026.
# Rule: an order is not updated before it is placed, and not placed after today. No test above fits.
# Write it as a query: extract_updated_before_placed.sql
