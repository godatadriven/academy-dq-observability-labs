# The setup guide's commands, on Linux, Mac, and Windows, at every push and pull request.
# If this is red, a participant's setup breaks the same way.
name: Setup works

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jaffle_shop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build the sandbox, as in the setup guide
        run: uv run build.py
      - name: Lab 1 tests fail on purpose, six of them
        shell: bash
        run: |
          uv run dbt test --select orders_daily_extract > lab1.txt || true
          grep "ERROR=6" lab1.txt
      - name: The agent's read command
        run: uv run python agent_tools.py read 2026-05-31
