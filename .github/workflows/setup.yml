# The setup guide's commands, on Linux, Mac, and Windows, at every push and pull request.
# If this is red, a participant's setup breaks the same way.
name: Setup works

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jaffle_shop
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: uv sync
        run: uv sync
      - name: Activate, Mac and Linux
        if: runner.os != 'Windows'
        shell: bash
        run: source .venv/bin/activate && dbt --version
      - name: Activate, Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope CurrentUser RemoteSigned -Force
          .venv\Scripts\activate
          dbt --version
      - name: dbt deps
        run: uv run dbt deps
      - name: dbt seed
        run: uv run dbt seed
      - name: dbt run
        run: uv run dbt run
      - name: dbt test, with every lab file switched off
        run: uv run dbt test
      - name: Soda setup check
        run: uv run soda scan -d jaffle_shop -c soda/configuration.yml -v NOW="2026-05-31 09:00:00" soda/setup_check.yml
      - name: The agent's read command
        run: uv run python agent_tools.py read 2026-05-31
